services:
  postgres:
   image: postgres:15 
   ports: 
    - "5432:5432"
   environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: htias
   volumes: 
     - postgres_data:/var/lib/postgresql/data

  redis:
   image: redis:7-alpine
   ports: 
    - "6379:6379"






volumes:
  postgres_data: